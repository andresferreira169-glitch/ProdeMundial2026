<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prode Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: rgba(255,255,255,0.08);
    --gold: #d4a017;
    --gold2: #f0c040;
    --accent: #3b82f6;
    --green: #22c55e;
    --text: #f0f0f0;
    --muted: #6b7280;
    --red: #ef4444;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: auto;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
    position: relative;
  }
  header::after {
    content: '';
    display: block;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-top: 1.5rem;
  }
  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 5vw, 4rem);
    letter-spacing: 0.1em;
    color: var(--gold2);
    text-shadow: 0 0 40px rgba(212,160,23,0.4);
  }
  .header-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    color: var(--muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* TABS */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 1.5rem 1rem;
    flex-wrap: wrap;
  }
  .tab {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 8px 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .tab:hover { border-color: var(--gold); color: var(--gold); }
  .tab.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

  /* SECTIONS */
  .section { display: none; padding: 0 1rem 3rem; }
  .section.active { display: block; }

  /* ===== FASE DE GRUPOS ===== */
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .group-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .group-header {
    background: var(--surface2);
    padding: 8px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--border);
  }
  .match-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    gap: 6px;
  }
  .match-row:first-of-type { border-top: none; }
  .team-home { text-align: right; font-size: 13px; color: var(--text); }
  .team-away { text-align: left; font-size: 13px; color: var(--text); }
  .score-area { display: flex; align-items: center; gap: 4px; }
  .score-input {
    width: 34px; height: 30px;
    text-align: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    transition: border-color 0.2s;
  }
  .score-input:focus { outline: none; border-color: var(--gold); }
  .score-sep { color: var(--muted); font-size: 13px; }
  .match-date { font-size: 10px; color: var(--muted); text-align: center; padding: 2px 0 4px; grid-column: 1/-1; }
  .user-bar {
    display: flex; gap: 6px; margin-bottom: 1.5rem;
    align-items: center; flex-wrap: wrap;
  }
  .user-bar label { font-size: 13px; color: var(--muted); margin-right: 4px; letter-spacing: 0.1em; font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; }
  .user-btn {
    padding: 5px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    border-radius: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  .user-btn:hover { border-color: var(--accent); color: var(--accent); }
  .user-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .save-btn {
    margin-top: 1.5rem;
    padding: 10px 28px;
    background: var(--gold);
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .save-btn:hover { opacity: 0.85; }

  /* ===== BRACKET ===== */
  .bracket-wrap {
    overflow-x: auto;
    padding: 1rem 0;
  }
  .bracket {
    display: flex;
    align-items: center;
    gap: 0;
    min-width: 900px;
    max-width: 1300px;
    margin: 0 auto;
    justify-content: center;
  }
  .bracket-col {
    display: flex;
    flex-direction: column;
    gap: 0;
    flex: 1;
  }
  .bracket-col.center-col {
    flex: 0 0 160px;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .bracket-slot {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .match-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin: 6px 4px;
    overflow: hidden;
    min-width: 130px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .match-card:hover { border-color: var(--gold); box-shadow: 0 0 12px rgba(212,160,23,0.15); }
  .match-card.editable { cursor: pointer; }
  .card-team {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    font-size: 12px;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .card-team:last-child { border-bottom: none; }
  .card-team.winner { background: rgba(212,160,23,0.12); color: var(--gold2); font-weight: 600; }
  .card-team.loser { color: var(--muted); }
  .card-team-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.05em; font-size: 12px; }
  .card-score {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    min-width: 16px;
    text-align: center;
  }
  .card-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-align: center;
    padding: 2px 4px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }
  .connector-right {
    position: absolute;
    right: -8px;
    top: 50%;
    width: 8px;
    height: 1px;
    background: var(--border);
  }

  /* trophy */
  .trophy-area {
    text-align: center;
    padding: 1rem;
  }
  .trophy-icon { font-size: 3rem; line-height: 1; }
  .trophy-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    color: var(--gold2);
    margin-top: 4px;
    letter-spacing: 0.1em;
  }
  .trophy-team {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    color: var(--text);
    margin-top: 2px;
    min-height: 1.2em;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 1.5rem;
    width: 320px;
    max-width: 95vw;
  }
  .modal h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    color: var(--gold2);
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
  }
  .modal-teams { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
  .modal-team {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
  }
  .modal-team-name { flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; letter-spacing: 0.05em; }
  .modal-score-input {
    width: 44px; height: 36px;
    text-align: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
  }
  .modal-score-input:focus { outline: none; border-color: var(--gold); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btn {
    padding: 8px 18px;
    border-radius: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }
  .modal-btn.confirm {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
  }
  .modal-btn:hover { opacity: 0.85; }
  .modal-note { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

  /* TABLA */
  .tabla-wrap { max-width: 600px; margin: 0 auto; }
  .tabla {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .tabla thead tr {
    background: var(--surface2);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--muted);
  }
  .tabla th, .tabla td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .tabla td:not(:first-child) { text-align: center; }
  .tabla th:not(:first-child) { text-align: center; }
  .tabla tbody tr:hover { background: var(--surface2); }
  .rank-1 { color: var(--gold2); font-weight: 600; font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; }
  .rank-2 { color: #9ca3af; }
  .rank-3 { color: #cd7c2f; }
  .pts-cell { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.1rem; }
  .bracket-instructions {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 1rem;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  /* SVG bracket connector */
  .bracket-svg-col {
    display: flex; align-items: center; justify-content: center;
    width: 20px; flex-shrink: 0;
  }
</style>
</head>

</div>

<div class="modal-overlay" id="modal">

      <button class="modal-btn" onclick="closeModal()">Cancelar</button>

  </div>
</div>

// ─── STATE ───────────────────────────────────────────────────────────────
let activeUser = USUARIOS[0];
let state = {}; // { userId: { matchId: {gl, gv} } }

function loadState() {
  try {
    const s = localStorage.getItem('prode2026');
    if (s) state = JSON.parse(s);
  } catch(e) {}
  USUARIOS.forEach(u => { if (!state[u]) state[u] = {}; });
}
function saveState() {
  localStorage.setItem('prode2026', JSON.stringify(state));
}
function saveAll() {
  saveState();
  const btn = event.target;
  btn.textContent = '✓ Guardado!';
  setTimeout(() => btn.textContent = '💾 Guardar todo', 1500);
}
function getPred(user, id, side) {
  return state[user]?.[id]?.[side] ?? '';
}
function setPred(user, id, side, val) {
  if (!state[user]) state[user] = {};
  if (!state[user][id]) state[user][id] = {};
  state[user][id][side] = val;
}
function getWinner(user, id, teamA, teamB) {
  const ga = state[user]?.[id]?.gl;
  const gb = state[user]?.[id]?.gv;
  if (ga === undefined || gb === undefined || ga === '' || gb === '') return null;
  if (parseInt(ga) > parseInt(gb)) return teamA;
  if (parseInt(gb) > parseInt(ga)) return teamB;
  return null; // draw — in KO needs penalties
}

// ─── TABS ────────────────────────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  event.target.classList.add('active');
  if (id === 'tabla') renderTabla();
  if (id === 'bracket') renderBracket();
}

// ─── USER BUTTONS ────────────────────────────────────────────────────────
function renderUserBtns() {
  ['userBtns','userBtns2'].forEach(cid => {
    const el = document.getElementById(cid);
    if (!el) return;
    el.innerHTML = USUARIOS.map(u =>
      `<button class="user-btn ${u===activeUser?'active':''}" onclick="switchUser('${u}',this)">${u}</button>`
    ).join('');
  });
}
function switchUser(u) {
  activeUser = u;
  renderUserBtns();
  renderGroups();
  renderBracket();
}

// ─── GRUPOS ──────────────────────────────────────────────────────────────
function renderGroups() {
  const grid = document.getElementById('groupsGrid');
  const grouped = {};
  PARTIDOS_GRUPOS.forEach(p => {
    if (!grouped[p.grupo]) grouped[p.grupo] = [];
    grouped[p.grupo].push(p);
  });
  grid.innerHTML = Object.keys(grouped).sort().map(g => {
    const matches = grouped[g];
    return `<div class="group-card">
      <div class="group-header">Grupo ${g}</div>
      ${matches.map(p => {
        const gl = getPred(activeUser, p.id, 'gl');
        const gv = getPred(activeUser, p.id, 'gv');
        return `<div class="match-date">${p.fecha}</div>
        <div class="match-row">
          <span class="team-home">${p.local}</span>
          <div class="score-area">
            <input class="score-input" type="number" min="0" max="20" value="${gl}"
              data-id="${p.id}" data-side="gl" oninput="onGroupInput(this)">
            <span class="score-sep">-</span>
            <input class="score-input" type="number" min="0" max="20" value="${gv}"
              data-id="${p.id}" data-side="gv" oninput="onGroupInput(this)">
          </div>
          <span class="team-away">${p.visita}</span>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}
function onGroupInput(el) {
  setPred(activeUser, parseInt(el.dataset.id), el.dataset.side, el.value);
}

// ─── BRACKET ─────────────────────────────────────────────────────────────
function getBracketTeam(user, matchId, side, fallback) {
  return state[user]?.[matchId]?.[side + '_team'] || fallback;
}
function setBracketTeams(user, matchId, teamA, teamB) {
  if (!state[user]) state[user] = {};
  if (!state[user][matchId]) state[user][matchId] = {};
  state[user][matchId]['teamA'] = teamA;
  state[user][matchId]['teamB'] = teamB;
}

function renderBracket() {
  const el = document.getElementById('bracketView');
  // Build columns: oct-left, cuartos-left, semis-left, final, semis-right, cuartos-right, oct-right
  // Simplified: render all rounds left-to-right
  const rounds = BRACKET_ROUNDS;

  let html = '';
  rounds.forEach(round => {
    html += `<div class="bracket-col" id="col-${round.round}">`;
    round.matches.forEach(m => {
      const ua = state[activeUser]?.[m.id];
      const tA = ua?.teamA || m.teamA;
      const tB = ua?.teamB || m.teamB;
      const sA = ua?.gl ?? '';
      const sB = ua?.gv ?? '';
      let winA = false, winB = false;
      if (sA !== '' && sB !== '') {
        if (parseInt(sA) > parseInt(sB)) winA = true;
        else if (parseInt(sB) > parseInt(sA)) winB = true;
      }
      const roundLabel = round.round === 'final3' ? '3° Puesto' :
                         round.round === 'final' ? '⚽ FINAL' :
                         round.label;
      html += `<div class="bracket-slot">
        <div class="match-card" onclick="openBracketModal(${m.id},'${escHtml(m.label)}','${escHtml(tA)}','${escHtml(tB)}')">
          <div class="card-label">${round.round==='final'?'🏆 FINAL':round.label}</div>
          <div class="card-team ${winA?'winner':sA!==''&&!winA&&sB!==''?'loser':''}">
            <span class="card-team-name">${tA}</span>
            <span class="card-score">${sA}</span>
          </div>
          <div class="card-team ${winB?'winner':sB!==''&&!winB&&sA!==''?'loser':''}">
            <span class="card-team-name">${tB}</span>
            <span class="card-score">${sB}</span>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
    // connector between cols
    if (round.round !== 'final') {
      html += `<div style="width:12px;flex-shrink:0;"></div>`;
    }
  });

  // Trophy
  const finalMatch = BRACKET_ROUNDS.find(r=>r.round==='final').matches[0];
  const fu = state[activeUser]?.[finalMatch.id];
  const fA = fu?.teamA || finalMatch.teamA;
  const fB = fu?.teamB || finalMatch.teamB;
  const fsA = fu?.gl ?? '';
  const fsB = fu?.gv ?? '';
  let champion = '';
  if (fsA !== '' && fsB !== '') {
    if (parseInt(fsA) > parseInt(fsB)) champion = fA;
    else if (parseInt(fsB) > parseInt(fsA)) champion = fB;
  }

  el.innerHTML = html;

  // Trophy area below bracket
  const trophyArea = document.getElementById('bracketTrophy') || (() => {
    const d = document.createElement('div');
    d.id = 'bracketTrophy';
    d.className = 'trophy-area';
    el.parentElement.insertBefore(d, el.nextSibling);
    return d;
  })();
  trophyArea.innerHTML = `
    <div class="trophy-icon">🏆</div>
    <div class="trophy-name">Campeón del Mundo</div>
    <div class="trophy-team" style="color:var(--gold2);font-size:1.3rem;font-family:'Bebas Neue',sans-serif;letter-spacing:0.1em;">${champion || '???'}</div>
  `;
}

function escHtml(s) { return (s||'').replace(/'/g,"\\'"); }

// ─── BRACKET MODAL ───────────────────────────────────────────────────────
let modalCtx = null;
function openBracketModal(id, label, teamA, teamB) {
  modalCtx = { id, teamA, teamB };
  const ua = state[activeUser]?.[id] || {};
  document.getElementById('modalTitle').textContent = label;
  document.getElementById('modalNote').textContent = 'Eliminatorias — en caso de empate, ingresá el resultado en 90 min (el que avanza se define en los penales).';
  document.getElementById('modalTeams').innerHTML = `
    <div class="modal-team">
      <span class="modal-team-name">${teamA}</span>
      <input class="modal-score-input" type="number" min="0" max="20" id="mScoreA" value="${ua.gl??''}">
    </div>
    <div class="modal-team">
      <span class="modal-team-name">${teamB}</span>
      <input class="modal-score-input" type="number" min="0" max="20" id="mScoreB" value="${ua.gv??''}">
    </div>
    ${ua.gl!==undefined&&ua.gv!==undefined&&parseInt(ua.gl)===parseInt(ua.gv)?`
    <div style="margin-top:8px;">
      <label style="font-size:12px;color:var(--muted);">Avanza en penales:</label>
      <select id="mPens" style="margin-left:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:13px;">
        <option value="">— elegir —</option>
        <option value="A" ${ua.pen==='A'?'selected':''}>${teamA}</option>
        <option value="B" ${ua.pen==='B'?'selected':''}>${teamB}</option>
      </select>
    </div>`:''}
  `;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); modalCtx=null; }
function confirmModal() {
  if (!modalCtx) return;
  const {id, teamA, teamB} = modalCtx;
  const sA = document.getElementById('mScoreA').value;
  const sB = document.getElementById('mScoreB').value;
  const pen = document.getElementById('mPens')?.value || '';
  if (!state[activeUser]) state[activeUser] = {};
  if (!state[activeUser][id]) state[activeUser][id] = {};
  state[activeUser][id].gl = sA;
  state[activeUser][id].gv = sB;
  state[activeUser][id].teamA = teamA;
  state[activeUser][id].teamB = teamB;
  if (pen) state[activeUser][id].pen = pen;
  saveState();
  closeModal();
  renderBracket();
}

// ─── TABLA ───────────────────────────────────────────────────────────────
function calcPuntos(user) {
  let pts = 0, count = 0;
  PARTIDOS_GRUPOS.forEach(p => {
    const gl = state[user]?.[p.id]?.gl;
    const gv = state[user]?.[p.id]?.gv;
    if (gl !== undefined && gl !== '' && gv !== undefined && gv !== '') {
      count++;
      // compare with "real" stored under user 'real' (admin)
      const rl = state['real']?.[p.id]?.gl;
      const rv = state['real']?.[p.id]?.gv;
      if (rl !== undefined && rl !== '') {
        if (gl===rl && gv===rv) pts += 5;
        else {
          const predSign = parseInt(gl)>parseInt(gv)?1:parseInt(gl)<parseInt(gv)?-1:0;
          const realSign = parseInt(rl)>parseInt(rv)?1:parseInt(rl)<parseInt(rv)?-1:0;
          if (predSign===realSign) pts += 3;
        }
      }
    }
  });
  return { pts, count };
}
function renderTabla() {
  const rows = USUARIOS.map(u => ({ u, ...calcPuntos(u) }))
    .sort((a,b) => b.pts-a.pts || b.count-a.count);
  document.getElementById('tablaCuerpo').innerHTML = rows.map((r,i) => {
    const rankClass = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
    return `<tr>
      <td class="${rankClass}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
      <td style="font-weight:500">${r.u}</td>
      <td class="pts-cell ${rankClass}">${r.pts}</td>
      <td style="color:var(--muted)">${r.count}</td>
    </tr>`;
  }).join('');
}

// ─── INIT ─────────────────────────────────────────────────────────────────
loadState();
renderUserBtns();
renderGroups();
</script>
